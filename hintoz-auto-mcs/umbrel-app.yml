releaseNotes: >-
  ⚠️ Stability and security update for v2.3.8


  Welcome to auto-mcs v2.3.9! This release focuses on security hardening, compatibility improvements, and fixes across server management. Some of the highlights include:
    - Hardened Modrinth imports, Telepath uploads, and archive extraction
    - Reworked backup migration and renaming for speed, reliability, and configuration compatibility
    - Improved modpack detection, template loading, and live ACL handling
    - Upgraded amscript to v1.6.1 with new updates to several scripts
    - Updated dependencies and fixed a range of issues involving archives, configuration parsing, and server management


  I am grateful to the community who helped improve this project through testing, feedback, and contributions. Hope you enjoy this update!
